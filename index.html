<h1>我已经三秒没有听到火的故事了</h1>
<p>真拿你没办法，坐好咯。据说会使用火的动物只有人类，因为不怕火，文明才得以发展，是不是这个原因呢？在网络的各个角落每天都有人在放火，真是令人发笑呢……只要有火种，之后就只需要看着。提问！火种燃尽之后会怎么样呢？三？二？一？ 时间到！正确答案是....火已渐熄，然位不见王影。当薪火的传承面临威胁之时，钟声响起，将古老的薪之王们从坟墓中唤醒……深渊圣者艾尔德里奇……法兰的不死军团，深渊守望者们……以及罪都的隐居之王，巨人尤姆……然而事实上……王者们终将舍弃他们的王座……而无火的灰烬将会苏醒。他们是无名、被诅咒的不死人，连成为薪柴都不配。正因如此，灰烬才如此渴求余烬。</p>
